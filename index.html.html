  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nter;\">\n            <img src=\"65987621-ad25-42c3-b2a1-0bebcfd1d5ea\" alt=\"GCash QR code\" style=\"width: 210px; height: 210px; object-fit: cover; object-position: center 34%; border: 1.5px solid #17150F; border-radius: 12px; flex: none;\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"font-size: 18px; font-weight: 700; line-height: 1.35;\">Customer scans, sends {{ totalLabel }}, then shows you the success screen.<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #6E6857; line-height: 1.55;\">Check the amount and that the name matches PA*****A C. before tapping paid.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display: flex; gap: 10px; padding: 0 22px 22px;\">\n          <button sc-camel-on-click=\"{{ closePay }}\" style=\"padding: 16px 22px; border: 1.5px solid #17150F; background: none; border-radius: 12px; font-family: Archivo, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;\">Back<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ confirmPay }}\" style=\"{{ confirmStyle }}\">{{ confirmLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ receiptOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; background: rgba(23,21,15,.55); display: flex; align-items: center; justify-content: center; animation: fadeIn .15s ease;\">\n      <div style=\"width: 470px; background: #FBF9F4; border: 1.5px solid #17150F; border-radius: 18px; overflow: hidden; animation: popIn .2s ease; box-shadow: 0 30px 60px rgba(23,21,15,.3);\">\n        <div style=\"padding: 26px 26px 18px; text-align: center; border-bottom: 1.5px dashed #C9C2B0;\">\n          <div style=\"font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: #6E6857;\">Paid · {{ receipt.method }}<\u002Fdiv>\n          <div style=\"{{ receipt.headStyle }}\">{{ receipt.headline }}<\u002Fdiv>\n          <div style=\"font-size: 15px; font-weight: 700; letter-spacing: .04em; margin-bottom: 6px;\">{{ receipt.subline }}<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #6E6857;\">{{ receipt.time }} · Oakridge Bazaar<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 16px 26px; display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto;\">\n          <sc-for list=\"{{ receipt.lines }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 14px;\">\n              <span style=\"font-weight: 600;\">{{ r.label }}<\u002Fspan>\n              <span style=\"font-weight: 700;\">{{ r.amount }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding: 14px 26px; border-top: 1.5px dashed #C9C2B0; display: flex; flex-direction: column; gap: 6px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n            <span style=\"font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;\">Total<\u002Fspan>\n            <span style=\"font-size: 30px; font-weight: 800; letter-spacing: -.02em;\">{{ receipt.total }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ receipt.showChange }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 13px; color: #6E6857;\">\n              <span>Cash {{ receipt.tender }}<\u002Fspan>\n              <span>Change {{ receipt.change }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding: 18px 26px 22px;\">\n          <button sc-camel-on-click=\"{{ newOrder }}\" style=\"width: 100%; padding: 18px; border: 1.5px solid #17150F; background: #17150F; color: #F4F1EA; border-radius: 12px; font-family: Archivo, sans-serif; font-size: 17px; font-weight: 700; cursor: pointer;\">Next order<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1194,&quot;height&quot;:834},&quot;ownerPin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1379&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Owner&quot;},&quot;upsizePrice&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;₱&quot;,&quot;section&quot;:&quot;Menu&quot;},&quot;startOrderNo&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:101,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:999,&quot;step&quot;:1,&quot;section&quot;:&quot;Menu&quot;},&quot;sheetUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sync&quot;}}\">\nconst CATALOG = [\n  { key: 'cultured', name: 'Cultured Yogurt', note: 'Smoothies · Bottled', accent: '#2F5D46', tint: '#E7EDE7',\n    items: [\n      { id: 'c1', name: 'Berries & Butter', sub: 'Smoothie', price: 250, upsizable: true },\n      { id: 'c2', name: 'Creamy Avocado', sub: 'Smoothie', price: 250, upsizable: true },\n      { id: 'c3', name: 'Cloud Smoothie', sub: 'Smoothie', price: 250, upsizable: true },\n      { id: 'c4', name: 'Sticky Mango Yogurt Smoothie', sub: 'Smoothie', price: 250, upsizable: true },\n      { id: 'c5', name: 'Bottled Yogurt 1L', sub: 'Large', price: 250 },\n      { id: 'c6', name: 'Bottled Yogurt 300ml', sub: 'Small', price: 150 }\n    ] },\n  { key: 'paella', name: 'Paella Bambino', note: 'Paella · Sides', accent: '#B45A0E', tint: '#F6E9DA',\n    items: [\n      { id: 'p1', name: 'Solo Paella', sub: 'Small', price: 220 },\n      { id: 'p2', name: 'Corn Ribs', sub: 'Side', price: 165 },\n      { id: 'p3', name: 'Paella to Share', sub: 'Large', price: 950 }\n    ] }\n];\nconst CONCEPT = {};\nCATALOG.forEach(g => g.items.forEach(it => { CONCEPT[it.id] = g.key; }));\nconst ACCENT = { cultured: '#2F5D46', paella: '#B45A0E' };\nconst STORE = 'oakridge-pos-v1';\nconst EXP_CATS = ['Ingredients', 'Packaging', 'Ice & water', 'Transport', 'Stall fees', 'Other'];\nconst EXP_CONCEPTS = [\n  { key: 'cultured', label: 'Cultured Yogurt', color: '#2F5D46', tint: '#E7EDE7' },\n  { key: 'paella', label: 'Paella Bambino', color: '#B45A0E', tint: '#F6E9DA' },\n  { key: 'shared', label: 'Shared', color: '#6E6857', tint: '#EFEBE0' }\n];\nconst peso = n => (n < 0 ? '−₱' : '₱') + Math.abs(Math.round(n)).toLocaleString('en-PH');\nconst dayKey = d => d.toISOString().slice(0, 10);\n\nclass Component extends DCLogic {\n  state = {\n    view: 'order', scope: 'today',\n    cart: [], soldOut: {}, stockMode: false, flash: null,\n    payOpen: false, method: 'cash', tender: '', name: '',\n    receipt: null, orders: [], nextNo: 101,\n    sheetUrl: '', pending: [], sent: 0, syncing: false, today: dayKey(new Date()),\n    pinOpen: false, pin: '', pinMsg: '', pinFor: 'reset',\n    expenses: [], expDesc: '', expAmt: '', expCat: 'Ingredients', expConcept: 'cultured'\n  };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(STORE);\n      if (raw) {\n        const d = JSON.parse(raw);\n        this.setState({\n          orders: d.orders || [], nextNo: d.nextNo || 101, soldOut: d.soldOut || {},\n          sheetUrl: d.sheetUrl || this.props.sheetUrl || '', pending: d.pending || [], sent: d.sent || 0,\n          expenses: d.expenses || []\n        });\n      } else {\n        this.setState({ sheetUrl: this.props.sheetUrl || '', nextNo: this.props.startOrderNo ?? 101 });\n      }\n    } catch (e) {}\n    this._tick = setInterval(() => { if (this.state.pending.length) this.flush(); }, 20000);\n    window.addEventListener('online', this._on = () => this.flush());\n  }\n  componentWillUnmount() { clearInterval(this._tick); clearTimeout(this._flashT); window.removeEventListener('online', this._on); }\n\n  persist(extra) {\n    const s = { ...this.state, ...extra };\n    try {\n      localStorage.setItem(STORE, JSON.stringify({\n        orders: s.orders, nextNo: s.nextNo, soldOut: s.soldOut, sheetUrl: s.sheetUrl, pending: s.pending, sent: s.sent, expenses: s.expenses\n      }));\n    } catch (e) {}\n  }\n  save(updater) {\n    this.setState(updater, () => this.persist());\n  }\n\n  async post(row) {\n    const url = this.state.sheetUrl.trim();\n    if (!url) return false;\n    try {\n      await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(row) });\n      return true;\n    } catch (e) { return false; }\n  }\n  async flush() {\n    if (this.state.syncing || !this.state.sheetUrl.trim() || !this.state.pending.length) return;\n    this.setState({ syncing: true });\n    const queue = this.state.pending.slice();\n    const failed = [];\n    let ok = 0;\n    for (const row of queue) { if (await this.post(row)) ok++; else failed.push(row); }\n    this.save(s => ({ pending: failed, sent: s.sent + ok, syncing: false }));\n  }\n\n  pinTap(k) {\n    if (k === '⌫') return this.setState(s => ({ pin: s.pin.slice(0, -1), pinMsg: '' }));\n    const pin = (this.state.pin + k).slice(0, 4);\n    this.setState({ pin, pinMsg: '' });\n    if (pin.length < 4) return;\n    setTimeout(() => {\n      if (pin === String(this.props.ownerPin ?? '1379')) {\n        if (this.state.pinFor === 'dash') {\n          this.setState({ pinOpen: false, pin: '', pinMsg: '', view: 'dash' });\n        } else {\n          this.save({ orders: [], expenses: [], pending: [], sent: 0, cart: [], receipt: null, pinOpen: false, pin: '', pinMsg: '', nextNo: this.props.startOrderNo ?? 101 });\n        }\n      } else {\n        this.setState({ pin: '', pinMsg: 'Wrong passcode' });\n      }\n    }, 160);\n  }\n\n  addExpense() {\n    const desc = (this.state.expDesc || '').trim();\n    const amt = Math.round(parseFloat(this.state.expAmt || '0'));\n    if (!desc || !amt || amt <= 0) return;\n    const now = new Date();\n    const ck = this.state.expConcept;\n    const cLabel = (EXP_CONCEPTS.find(c => c.key === ck) || EXP_CONCEPTS[2]).label;\n    const exp = { desc, amount: amt, cat: this.state.expCat, concept: ck, ts: now.toISOString(), day: dayKey(now) };\n    const row = { sheet: 'Expenses', timestamp: now.toISOString(), concept: cLabel, category: exp.cat, description: desc, amount: amt };\n    this.save(s => ({ expenses: [...s.expenses, exp], pending: [...s.pending, row], expDesc: '', expAmt: '' }));\n    setTimeout(() => this.flush(), 60);\n  }\n\n  add(item) {\n    if (this.state.stockMode) return this.save(s => ({ soldOut: { ...s.soldOut, [item.id]: !s.soldOut[item.id] } }));\n    if (this.state.soldOut[item.id]) return;\n    clearTimeout(this._flashT);\n    this.setState({ flash: item.id });\n    this._flashT = setTimeout(() => this.setState({ flash: null }), 1600);\n    this.setState(s => {\n      const k = item.id + '|0';\n      const i = s.cart.findIndex(l => l.key === k);\n      if (i > -1) { const c = s.cart.slice(); c[i] = { ...c[i], qty: c[i].qty + 1 }; return { cart: c }; }\n      return { cart: [...s.cart, { key: k, id: item.id, name: item.name, sub: item.sub, price: item.price, upsizable: !!item.upsizable, upsize: false, qty: 1 }] };\n    });\n  }\n  bump(key, d) { this.setState(s => ({ cart: s.cart.map(l => l.key === key ? { ...l, qty: l.qty + d } : l).filter(l => l.qty > 0) })); }\n  toggleUp(key) {\n    this.setState(s => {\n      const l = s.cart.find(x => x.key === key); if (!l) return null;\n      const nk = l.id + '|' + (l.upsize ? 0 : 1);\n      if (s.cart.find(x => x.key === nk)) return { cart: s.cart.filter(x => x.key !== key).map(x => x.key === nk ? { ...x, qty: x.qty + l.qty } : x) };\n      return { cart: s.cart.map(x => x.key === key ? { ...x, key: nk, upsize: !x.upsize } : x) };\n    });\n  }\n  upsizeFee() { return this.props.upsizePrice ?? 30; }\n  unit(l) { return l.price + (l.upsize ? this.upsizeFee() : 0); }\n  total() { return this.state.cart.reduce((t, l) => t + this.unit(l) * l.qty, 0); }\n  keypad(v) {\n    this.setState(s => {\n      if (v === 'del') return { tender: s.tender.slice(0, -1) };\n      if (v === 'c') return { tender: '' };\n      return { tender: (s.tender + v).replace(/^0+(?=\\d)/, '').slice(0, 6) };\n    });\n  }\n\n  confirm() {\n    const t = this.total(); if (!t) return;\n    const tender = parseInt(this.state.tender || '0', 10);\n    if (this.state.method === 'cash' && tender < t) return;\n    const now = new Date();\n    const nm = (this.state.name || '').trim();\n    const items = this.state.cart.map(l => ({ id: l.id, name: l.name, concept: CONCEPT[l.id], qty: l.qty, unit: this.unit(l), upsize: l.upsize }));\n    const order = {\n      no: this.state.nextNo, name: nm, method: this.state.method === 'cash' ? 'Cash' : 'GCash',\n      total: t, tender: this.state.method === 'cash' ? tender : 0,\n      change: this.state.method === 'cash' ? Math.max(0, tender - t) : 0,\n      ts: now.toISOString(), day: dayKey(now), hour: now.getHours(), items\n    };\n    const row = {\n      sheet: 'Sales',\n      timestamp: now.toISOString(), order_no: order.no, name: nm, method: order.method,\n      total: t, cash_received: order.tender, change: order.change,\n      items: items.map(i => i.qty + '× ' + i.name + (i.upsize ? ' (upsized)' : '')).join(', '),\n      cultured: items.filter(i => i.concept === 'cultured').reduce((a, i) => a + i.unit * i.qty, 0),\n      paella: items.filter(i => i.concept === 'paella').reduce((a, i) => a + i.unit * i.qty, 0)\n    };\n    this.save(s => ({\n      receipt: {\n        no: String(s.nextNo), method: order.method,\n        headline: nm || ('#' + s.nextNo), subline: nm ? 'Order #' + s.nextNo : 'Order number',\n        headStyle: { fontFamily: \"'Instrument Serif', serif\", lineHeight: 1.05, margin: '6px 0 2px', fontSize: nm ? (nm.length > 10 ? 46 : 62) : 76 },\n        time: now.toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }),\n        lines: items.map(i => ({ label: i.qty + '× ' + i.name + (i.upsize ? ' (upsized)' : ''), amount: peso(i.unit * i.qty) })),\n        total: peso(t), showChange: s.method === 'cash', tender: peso(tender), change: peso(Math.max(0, tender - t))\n      },\n      orders: [...s.orders, order], pending: [...s.pending, row],\n      payOpen: false, cart: [], tender: '', name: '', nextNo: s.nextNo + 1\n    }));\n    setTimeout(() => this.flush(), 60);\n  }\n\n  renderVals() {\n    const s = this.state, t = this.total();\n    const tender = parseInt(s.tender || '0', 10);\n    const enough = s.method === 'gcash' || tender >= t;\n    const todays = s.orders.filter(o => o.day === s.today);\n    const scoped = s.scope === 'today' ? todays : s.orders;\n    const scopedExp = s.scope === 'today' ? s.expenses.filter(x => x.day === s.today) : s.expenses;\n    const expReady = !!(s.expDesc || '').trim() && parseFloat(s.expAmt || '0') > 0;\n    const sum = a => a.reduce((x, o) => x + o.total, 0);\n\n    const groups = CATALOG.map(g => ({\n      name: g.name, note: g.note,\n      headStyle: { background: g.tint, borderBottom: '1.5px solid #17150F', padding: '10px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', color: g.accent },\n      items: g.items.map(it => {\n        const out = !!s.soldOut[it.id], lit = s.flash === it.id;\n        return {\n          name: it.name, priceLabel: peso(it.price),\n          sub: out ? 'Sold out' : (it.upsizable ? it.sub + ' · +' + this.upsizeFee() + ' upsize' : it.sub),\n          onTap: () => this.add(it),\n          style: {\n            display: 'flex', flexDirection: 'column', justifyContent: 'space-between', gap: 14,\n            minHeight: 118, minWidth: 0, padding: '16px 16px 14px', borderRadius: 14, cursor: 'pointer',\n            border: '1.5px solid ' + (s.stockMode ? '#A8321E' : '#17150F'),\n            background: out ? '#E6E2D8' : (lit ? g.accent : '#FBF9F4'),\n            opacity: out ? .45 : 1,\n            boxShadow: out ? 'none' : (lit ? '0 2px 0 #17150F' : '0 2px 0 ' + g.accent),\n            transform: lit ? 'scale(.97)' : 'none',\n            transition: lit ? 'none' : 'background .55s ease, color .55s ease, transform .25s ease',\n            fontFamily: 'Archivo, sans-serif', color: lit ? '#FBF9F4' : '#17150F', textDecoration: out ? 'line-through' : 'none'\n          }\n        };\n      })\n    }));\n\n    const cart = s.cart.map(l => ({\n      name: l.name, qty: l.qty, upsizable: l.upsizable,\n      unitLabel: peso(this.unit(l)) + (l.upsize ? ' upsized' : ''),\n      lineTotal: peso(this.unit(l) * l.qty),\n      inc: () => this.bump(l.key, 1), dec: () => this.bump(l.key, -1), toggleUpsize: () => this.toggleUp(l.key),\n      upsizeStyle: { padding: '10px 14px', borderRadius: 999, cursor: 'pointer', fontFamily: 'Archivo, sans-serif',\n        fontSize: 13, fontWeight: 700, border: '1.5px solid #2F5D46',\n        background: l.upsize ? '#2F5D46' : 'transparent', color: l.upsize ? '#F4F1EA' : '#2F5D46' }\n    }));\n\n    const lineItems = [];\n    scoped.forEach(o => o.items.forEach(i => lineItems.push(i)));\n    const byItem = {};\n    lineItems.forEach(i => {\n      const k = i.name;\n      byItem[k] = byItem[k] || { name: i.name, qty: 0, rev: 0, concept: i.concept };\n      byItem[k].qty += i.qty; byItem[k].rev += i.unit * i.qty;\n    });\n    const sellers = Object.values(byItem).sort((a, b) => b.qty - a.qty).slice(0, 6);\n    const topQty = sellers.length ? sellers[0].qty : 1;\n\n    const conceptTotals = { cultured: 0, paella: 0 }, conceptUnits = { cultured: 0, paella: 0 };\n    lineItems.forEach(i => { conceptTotals[i.concept] += i.unit * i.qty; conceptUnits[i.concept
